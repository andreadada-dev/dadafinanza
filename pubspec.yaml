name: balyn
description: Balyn — private-first personal finance tracker.
publish_to: none
version: 1.8.0+24

environment:
  sdk: '>=3.12.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  shaders:
    - shaders/balyn_background.frag
    - shaders/balyn_ink.frag

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.2.0
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.2.0
  home_widget: ^0.9.3
  image_picker: ^1.2.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  sqflite: ^2.4.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
