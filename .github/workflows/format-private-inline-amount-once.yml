name: Format privacy-safe inline transaction detail

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/format-private-inline-amount-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format changed Flutter detail
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/widgets/balyn_transaction_detail_content.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib/widgets/balyn_transaction_detail_content.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format privacy-safe inline transaction input"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
