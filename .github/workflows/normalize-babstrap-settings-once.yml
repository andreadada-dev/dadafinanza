name: Normalize grouped settings design

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/normalize-babstrap-settings-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format changed Dart sources
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/screens/personal_settings_screen.dart lib/widgets/balyn_settings_components.dart test/settings_babstrap_restyle_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib/screens/personal_settings_screen.dart lib/widgets/balyn_settings_components.dart test/settings_babstrap_restyle_test.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(settings): format grouped Revolut settings"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
