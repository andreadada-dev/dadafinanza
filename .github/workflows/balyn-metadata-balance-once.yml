name: Balyn metadata and balance verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/balyn-metadata-balance-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dart format
        run: |
          dart format lib/widgets/transaction_metadata_fields.dart lib/widgets/quick_suggestion_strip.dart lib/widgets/balyn_revolut_home_hero.dart test/balyn_home_global_search_test.dart test/transaction_metadata_fields_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/transaction_metadata_fields.dart lib/widgets/quick_suggestion_strip.dart lib/widgets/balyn_revolut_home_hero.dart test/balyn_home_global_search_test.dart test/transaction_metadata_fields_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format metadata and centered balance UI"
            git push origin HEAD:main
          fi
      - name: Focused widget tests
        run: flutter test test/transaction_metadata_fields_test.dart test/balyn_home_global_search_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: All tests
        run: flutter test
