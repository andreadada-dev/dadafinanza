name: Balyn search and metadata verification
on:
  push:
    branches: [fix/balyn-visible-liquid-background]
    paths: [.github/workflows/balyn-search-verify-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format edited files
        run: |
          dart format lib/widgets/balyn_cue_three_dots_action.dart lib/widgets/balyn_global_search_bar.dart lib/widgets/balyn_revolut_home_hero.dart lib/screens/account_context_home_screen.dart lib/screens/app_shell.dart lib/widgets/transaction_metadata_fields.dart lib/screens/quick_add_page.dart test/balyn_hero_cue_morph_test.dart test/balyn_home_global_search_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: format Home global search and metadata updates"
            git push origin HEAD:fix/balyn-visible-liquid-background
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
