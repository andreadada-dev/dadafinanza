name: One-off l10n inventory

on:
  push:
    branches:
      - 'feature/multilanguage'

permissions:
  contents: write

concurrency:
  group: dadafinanza-l10n-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build user-facing string inventory
        shell: python
        run: |
          from pathlib import Path
          import re

          candidates = []
          roots = [Path("lib")]
          string_re = re.compile(r"""(?P<q>['"])(?P<s>(?:\\.|(?!\1).)*?)(?P=q)""")

          excluded_prefixes = (
              "package:", "dart:", "assets/", "android/", "https://", "http://",
          )
          excluded_exact = {
              "EUR", "USD", "GBP", "CHF", "it_IT", "en_US",
              "system", "light", "dark", "balanced",
              "expense", "income", "transfer",
          }
          dbish = re.compile(r"^(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|PRAGMA|WITH)\b", re.I)
          identifier = re.compile(r"^[a-z0-9_./:-]+$")

          for root in roots:
              for path in root.rglob("*.dart"):
                  text = path.read_text(encoding="utf-8")
                  for lineno, line in enumerate(text.splitlines(), 1):
                      stripped = line.strip()
                      if stripped.startswith(("import ", "export ", "part ")):
                          continue
                      for match in string_re.finditer(line):
                          raw = match.group("s")
                          s = raw.replace(r"\'", "'").replace(r'\"', '"')
                          if len(s.strip()) < 2:
                              continue
                          if s in excluded_exact or s.startswith(excluded_prefixes):
                              continue
                          if dbish.match(s.strip()):
                              continue
                          if identifier.match(s) and not any(ch.isupper() for ch in s):
                              continue
                          if not re.search(r"[A-Za-zÀ-ÿ]", s):
                              continue
                          likely_ui = (
                              " " in s
                              or s[:1].isupper()
                              or any(ch in s for ch in "ÀÈÉÌÒÙàèéìòù?!…")
                              or "$" in s
                          )
                          if not likely_ui:
                              continue
                          candidates.append((s, str(path), lineno))

          grouped = {}
          for s, path, line in candidates:
              grouped.setdefault(s, []).append(f"{path}:{line}")

          out = []
          for i, s in enumerate(sorted(grouped, key=lambda x: x.casefold()), 1):
              out.append(f"## {i:04d}")
              out.append(s)
              for where in sorted(set(grouped[s])):
                  out.append(f"  - {where}")
              out.append("")

          target = Path("tools/l10n_inventory.txt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("\n".join(out), encoding="utf-8")
          print(f"Inventory: {len(grouped)} unique strings")

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/l10n_inventory.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate localization string inventory"
          git push origin HEAD:"${GITHUB_REF_NAME}"
