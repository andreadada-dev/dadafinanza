name: Temporary pinned Dart formatting
on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/temp-format-pinned.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: dart format lib test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: align Dart format with Flutter 3.47.2 CI"
            git push
          fi
