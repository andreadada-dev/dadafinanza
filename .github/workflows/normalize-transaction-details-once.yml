name: Normalize transaction detail layout once

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/normalize-transaction-details-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format details and update branch
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/widgets/balyn_transaction_detail_content.dart test/balyn_revolut_finance_redesign_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib/widgets/balyn_transaction_detail_content.dart test/balyn_revolut_finance_redesign_test.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(detail): format compact transaction view"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
