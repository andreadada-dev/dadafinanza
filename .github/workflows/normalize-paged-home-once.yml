name: Normalize paged Home and liquid lens (retry)

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/normalize-paged-home-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies, format and push
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/screens/account_context_home_screen.dart lib/widgets/balyn_revolut_home_hero.dart lib/widgets/balyn_glass_navigation.dart test/home_glass_navigation_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib test
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format swipeable Home and liquid glass"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
