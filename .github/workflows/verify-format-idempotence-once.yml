name: Normalize Balyn redesign formatting (one time)

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/verify-format-idempotence-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format, verify idempotence, and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          echo "---- Formatter diff ----"
          git diff --stat
          git diff --check
          echo "---- Idempotence check ----"
          dart format --output=none --set-exit-if-changed lib test
          git add lib test
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style: normalize Flutter design formatting"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
