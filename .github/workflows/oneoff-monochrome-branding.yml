name: One-off monochrome branding render

on:
  push:
    branches:
      - 'feature/branding-monochrome'
    paths:
      - '.github/workflows/oneoff-monochrome-branding.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rendering dependencies
        run: python3 -m pip install --disable-pip-version-check cairosvg pillow

      - name: Render derived branding assets
        shell: python
        run: |
          from pathlib import Path
          import cairosvg
          from PIL import Image

          root = Path("assets/branding")
          svg = root / "dadafinanza_logo.svg"
          png512 = root / "dadafinanza_logo_512.png"
          png800 = root / "dadafinanza_logo_800.png"
          foreground = Path(
              "android/app/src/main/res/drawable-nodpi/"
              "ic_launcher_foreground.png"
          )
          foreground.parent.mkdir(parents=True, exist_ok=True)

          cairosvg.svg2png(
              url=str(svg),
              write_to=str(png512),
              output_width=512,
              output_height=512,
          )
          cairosvg.svg2png(
              url=str(svg),
              write_to=str(png800),
              output_width=800,
              output_height=800,
          )

          source = Image.open(png512).convert("RGBA")
          out = Image.new("RGBA", source.size, (255, 255, 255, 0))
          pixels = []
          for r, g, b, _ in source.getdata():
              # Official artwork is grayscale: #212121 background, white mark.
              lum = round((r + g + b) / 3)
              alpha = round(max(0, min(255, (lum - 33) * 255 / 222)))
              pixels.append((255, 255, 255, alpha))
          out.putdata(pixels)
          out.save(foreground)

          for path, size in (
              (png512, (512, 512)),
              (png800, (800, 800)),
              (foreground, (512, 512)),
          ):
              image = Image.open(path)
              image.load()
              assert image.size == size, (path, image.size)
              print(path, image.size, image.mode)

      - name: Commit derived branding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/branding/dadafinanza_logo_512.png             assets/branding/dadafinanza_logo_800.png             android/app/src/main/res/drawable-nodpi/dadafinanza_logo_512.png             android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          if git diff --cached --quiet; then
            echo "Derived branding already up to date."
            exit 0
          fi
          git commit -m "Render monochrome branding derivatives"
          git push origin HEAD:"${GITHUB_REF_NAME}"
