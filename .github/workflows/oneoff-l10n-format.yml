name: One-off multilingual formatter

on:
  push:
    branches:
      - 'feature/multilanguage-post'

permissions:
  contents: write

concurrency:
  group: dadafinanza-l10n-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Resolve packages
        run: flutter pub get

      - name: Format localization changes
        run: dart format lib test

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Apply canonical Dart formatting to localization"
          git push origin HEAD:"${GITHUB_REF_NAME}"
