name: Temporary Home summary finalize

on:
  push:
    branches:
      - 'build/restore-home-summary'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/restore-home-summary
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Finalize widget sets
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/account_context_home_screen.dart')
          source = path.read_text()

          fallback_start = source.index('  static const _fallbackTypes = <DashboardWidgetType>[')
          fallback_end = source.index('\n  ];', fallback_start) + len('\n  ];')
          fallback = '\n'.join([
              '  static const _fallbackTypes = <DashboardWidgetType>[',
              '    DashboardWidgetType.totalBalance,',
              '    DashboardWidgetType.monthlyCashFlow,',
              '    DashboardWidgetType.safeToSpend,',
              '    DashboardWidgetType.accounts,',
              '    DashboardWidgetType.monthlyBudget,',
              '    DashboardWidgetType.recentTransactions,',
              '    DashboardWidgetType.upcomingRecurring,',
              '    DashboardWidgetType.goals,',
              '    DashboardWidgetType.topCategories,',
              '    DashboardWidgetType.endMonthForecast,',
              '    DashboardWidgetType.unassignedTransactions,',
              '  ];',
          ])
          source = source[:fallback_start] + fallback + source[fallback_end:]

          fixed_start = source.index('  static const _fixedSummaryTypes = <DashboardWidgetType>{')
          fixed_end = source.index('\n  };', fixed_start) + len('\n  };')
          fixed = '\n'.join([
              '  static const _fixedSummaryTypes = <DashboardWidgetType>{',
              '    DashboardWidgetType.totalBalance,',
              '    DashboardWidgetType.monthlyIncome,',
              '    DashboardWidgetType.monthlyExpense,',
              '    DashboardWidgetType.safeToSpend,',
              '  };',
          ])
          source = source[:fixed_start] + fixed + source[fixed_end:]
          path.write_text(source)
      - run: dart format lib/screens/account_context_home_screen.dart test/home_summary_layout_test.dart
      - name: Commit final widget sets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already final"
            exit 0
          fi
          git config user.name "Dada"
          git config user.email "63845798+andreadada@users.noreply.github.com"
          git add lib/screens/account_context_home_screen.dart test/home_summary_layout_test.dart
          git commit -m "fix: preserve configurable cash flow section"
          git push origin HEAD:build/restore-home-summary
