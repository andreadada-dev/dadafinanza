name: Android Production AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dadafinanza-production-aab
  cancel-in-progress: true

jobs:
  build:
    name: Build signed production AAB
    runs-on: [self-hosted, linux, x64, local-pc, android, release]
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADAFINANZA_REQUIRE_RELEASE_SIGNING: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify local build export
        shell: bash
        run: |
          if [ ! -d /builds ]; then
            echo "::error::/builds is not mounted on the Android release runner."
            exit 1
          fi
          mkdir -p /builds/dadafinanza
          test -w /builds/dadafinanza

      - name: Verify required signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Repair incomplete Flutter SDK cache
        shell: bash
        run: |
          cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/flutter/stable-3.47.2-x64"
          if [ -d "$cache_root" ] && [ ! -f "$cache_root/flutter/bin/internal/shared.sh" ]; then
            echo "Removing incomplete Flutter SDK cache: $cache_root"
            rm -rf "$cache_root"
          fi

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - name: Trust Flutter SDK
        shell: bash
        run: |
          if ! git config --global --get-all safe.directory | grep --fixed-strings --line-regexp --quiet "$FLUTTER_ROOT"; then
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi

      - name: Verify Flutter SDK
        run: |
          test -f "$FLUTTER_ROOT/bin/internal/shared.sh"
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dadafinanza-upload.jks"
          chmod 600 "$RUNNER_TEMP/dadafinanza-upload.jks"

      - name: Build signed production AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dadafinanza-upload.jks
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1
        run: |
          set -euo pipefail
          base_build="$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          build_number=$((base_build + GITHUB_RUN_NUMBER - 1))
          echo "Google Play versionCode: $build_number"
          flutter build appbundle --release --no-pub --build-number="$build_number"

      - name: Verify signed AAB
        shell: bash
        run: |
          source="build/app/outputs/bundle/release/app-release.aab"
          test -f "$source"
          jarsigner -verify "$source"

      - name: Save signed AAB on local PC
        shell: bash
        run: |
          set -euo pipefail
          source="build/app/outputs/bundle/release/app-release.aab"
          base_build="$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          build_number=$((base_build + GITHUB_RUN_NUMBER - 1))
          destination="/builds/dadafinanza/DadaFinanza-production-vc${build_number}-run${GITHUB_RUN_NUMBER}.aab"
          latest="/builds/dadafinanza/DadaFinanza-production-latest.aab"

          cp "$source" "$destination"
          cp "$source" "$latest"
          sha256sum "$destination" | tee "$destination.sha256"

          echo "AAB saved to: $destination"
          echo "Latest copy: $latest"

      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/dadafinanza-upload.jks"
