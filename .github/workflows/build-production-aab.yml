name: Android Production APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/final-production-aab'

permissions:
  contents: read

concurrency:
  group: dadafinanza-production-release
  cancel-in-progress: true

jobs:
  build:
    name: Build signed production APK + AAB
    runs-on: [self-hosted, linux, x64, local-pc, android, release]
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      DADAFINANZA_REQUIRE_RELEASE_SIGNING: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify local build export
        shell: bash
        run: |
          if [ ! -d /builds ]; then
            echo "::error::/builds is not mounted on the Android release runner."
            exit 1
          fi
          mkdir -p /builds/dadafinanza
          test -w /builds/dadafinanza

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve production signing
        shell: bash
        run: |
          set -euo pipefail

          temp_keystore="$RUNNER_TEMP/dadafinanza-upload.jks"
          local_signing_dir="/builds/dadafinanza/signing"
          local_keystore="$local_signing_dir/dadafinanza-upload.jks"
          local_credentials="$local_signing_dir/dadafinanza-upload.env"

          github_signing=1
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              github_signing=0
            fi
          done

          if [ "$github_signing" -eq 1 ]; then
            echo "Using GitHub Actions release-signing secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$temp_keystore"
            chmod 600 "$temp_keystore"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            echo "::add-mask::$ANDROID_KEY_PASSWORD"
            {
              echo "ANDROID_KEYSTORE_PATH=$temp_keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "GitHub signing secrets are not configured; using the persistent local signing vault."
          mkdir -p "$local_signing_dir"
          chmod 700 "$local_signing_dir" || true

          if [ ! -f "$local_keystore" ] || [ ! -f "$local_credentials" ]; then
            echo "No local upload key found. Generating the initial DadaFinanza upload key."

            store_password="$(openssl rand -hex 24)"
            key_password="$(openssl rand -hex 24)"
            key_alias="dadafinanza-upload"

            keytool -genkeypair               -v               -keystore "$local_keystore"               -alias "$key_alias"               -keyalg RSA               -keysize 4096               -validity 10000               -storepass "$store_password"               -keypass "$key_password"               -dname "CN=DadaFinanza, OU=Mobile, O=DDone, C=IT"

            chmod 600 "$local_keystore" || true
            umask 077
            cat > "$local_credentials" <<EOF
          ANDROID_KEYSTORE_PASSWORD=$store_password
          ANDROID_KEY_ALIAS=$key_alias
          ANDROID_KEY_PASSWORD=$key_password
          EOF
            chmod 600 "$local_credentials" || true

            cat > "$local_signing_dir/README.txt" <<'EOF'
          DadaFinanza Android upload signing material.

          Keep BOTH dadafinanza-upload.jks and dadafinanza-upload.env backed up in a secure location.
          Never commit these files to Git.
          The .env file contains the passwords required to sign future uploads.
          If Play App Signing is enabled, this is the upload key, not Google's app-signing key.
          EOF

            echo "Generated signing material in: $local_signing_dir"
          else
            echo "Reusing existing local DadaFinanza upload key."
          fi

          set -a
          # shellcheck disable=SC1090
          source "$local_credentials"
          set +a

          # Java defaults to PKCS12 when -storetype is omitted. PKCS12 uses the
          # store password for the private key as well, so repair credentials
          # created by the first bootstrap attempt before the JKS format was pinned.
          keystore_type="$(keytool -list -v -keystore "$local_keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Keystore type:/{print $2; exit}')"
          if [ "$keystore_type" = "PKCS12" ]; then
            ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            umask 077
            cat > "$local_credentials" <<EOF
          ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS
          ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
            chmod 600 "$local_credentials" || true
            echo "Repaired local PKCS12 signing credentials."
          fi

          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"

          {
            echo "ANDROID_KEYSTORE_PATH=$local_keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          keytool -list             -keystore "$local_keystore"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS"             | sed -E 's/(SHA(1|256): ).*/\1[verified]/'

      - name: Repair incomplete Flutter SDK cache
        shell: bash
        run: |
          cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/flutter/stable-3.47.2-x64"
          if [ -d "$cache_root" ] && [ ! -f "$cache_root/flutter/bin/internal/shared.sh" ]; then
            echo "Removing incomplete Flutter SDK cache: $cache_root"
            rm -rf "$cache_root"
          fi

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - name: Trust Flutter SDK
        shell: bash
        run: |
          if ! git config --global --get-all safe.directory | grep --fixed-strings --line-regexp --quiet "$FLUTTER_ROOT"; then
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi

      - name: Verify Flutter SDK
        run: |
          test -f "$FLUTTER_ROOT/bin/internal/shared.sh"
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Bound Gradle resources for release runner
        shell: bash
        run: |
          properties=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$properties"; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8/' "$properties"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' >> "$properties"
          fi
          cat >> "$properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx512m
          EOF

      - name: Build signed production AAB
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1
        run: |
          set -euo pipefail
          base_build="$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          build_number=$((base_build + GITHUB_RUN_NUMBER - 1))
          echo "Google Play versionCode: $build_number"
          flutter build appbundle --release --no-pub --build-number="$build_number"

      - name: Build signed production APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1
        run: |
          set -euo pipefail
          base_build="$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          build_number=$((base_build + GITHUB_RUN_NUMBER - 1))
          echo "APK versionCode: $build_number"
          flutter build apk --release --no-pub --build-number="$build_number"

      - name: Verify signed release files
        shell: bash
        run: |
          set -euo pipefail

          aab="build/app/outputs/bundle/release/app-release.aab"
          apk="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$aab"
          test -f "$apk"

          jarsigner -verify "$aab"

          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found in Android SDK build-tools."
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

      - name: Save signed production files on local PC
        shell: bash
        run: |
          set -euo pipefail
          aab_source="build/app/outputs/bundle/release/app-release.aab"
          apk_source="build/app/outputs/flutter-apk/app-release.apk"
          base_build="$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          build_number=$((base_build + GITHUB_RUN_NUMBER - 1))

          aab_destination="/builds/dadafinanza/DadaFinanza-production-vc${build_number}-run${GITHUB_RUN_NUMBER}.aab"
          aab_latest="/builds/dadafinanza/DadaFinanza-production-latest.aab"
          apk_destination="/builds/dadafinanza/DadaFinanza-production-vc${build_number}-run${GITHUB_RUN_NUMBER}.apk"
          apk_latest="/builds/dadafinanza/DadaFinanza-production-latest.apk"

          cp "$aab_source" "$aab_destination"
          cp "$aab_source" "$aab_latest"
          cp "$apk_source" "$apk_destination"
          cp "$apk_source" "$apk_latest"

          sha256sum "$aab_destination" | tee "$aab_destination.sha256"
          sha256sum "$apk_destination" | tee "$apk_destination.sha256"

          echo "Production versionCode: $build_number"
          echo "AAB saved to: $aab_destination"
          echo "APK saved to: $apk_destination"
          echo "Latest AAB: $aab_latest"
          echo "Latest APK: $apk_latest"
          echo "Signing backup: /builds/dadafinanza/signing"

      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/dadafinanza-upload.jks"
