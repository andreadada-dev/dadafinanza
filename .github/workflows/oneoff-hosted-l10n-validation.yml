name: One-off hosted multilingual validation
# Final multilingual validation trigger

on:
  push:
    branches:
      - 'feature/multilanguage-post'

permissions:
  contents: read

concurrency:
  group: dadafinanza-l10n-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Pub get
        run: flutter pub get

      - name: Verify Android locale resources are reproducible
        shell: bash
        run: |
          python3 tools/materialize_android_l10n.py
          git diff --exit-code -- android/app/src/main/res

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Bound Gradle resources
        shell: bash
        run: |
          properties=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$properties"; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8/' "$properties"
          else
            echo 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' >> "$properties"
          fi
          cat >> "$properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx768m
          EOF

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: flutter build apk --debug

      - name: Verify debug APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk
