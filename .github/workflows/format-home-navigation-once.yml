name: Format Home navigation once

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/format-home-navigation-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Normalize and push
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/screens/app_shell.dart
          dart format --output=none --set-exit-if-changed lib test
          git add lib/screens/app_shell.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format updated Home navigation"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
