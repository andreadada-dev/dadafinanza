name: One-off finalize localization resources

on:
  push:
    branches:
      - 'feature/multilanguage-post'
    paths:
      - 'tools/materialize_android_l10n.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize Android locale resources
        run: python3 tools/materialize_android_l10n.py

      - name: Commit resources and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/values-*/strings.xml
          git rm .github/workflows/oneoff-finalize-l10n.yml
          git commit -m "Materialize Android multilingual resources"
          git push origin HEAD:"${GITHUB_REF_NAME}"
