name: Normalize Cue navigation and worm indicator

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/normalize-cue-navigation-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/screens/app_shell.dart lib/screens/balyn_onboarding_flow.dart lib/widgets/balyn_cue_section_bar.dart lib/widgets/balyn_quick_action_launcher.dart lib/widgets/balyn_revolut_home_hero.dart test/home_glass_navigation_test.dart test/balyn_revolut_finance_redesign_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add pubspec.lock lib test
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: lock Cue and smooth_page_indicator dependencies; format navigation"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
