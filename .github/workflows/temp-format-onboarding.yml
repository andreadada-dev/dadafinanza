name: Temporary Dart formatting
# Final normalization for the loading regression tests
on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/temp-format-onboarding.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format lib test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: format Skeletonizer and onboarding motion"
            git push
          fi
