name: Temporary Home summary repair

on:
  push:
    branches:
      - 'build/restore-home-summary'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/restore-home-summary
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply repair
        shell: python
        run: |
          from pathlib import Path

          home = Path('lib/screens/account_context_home_screen.dart')
          source = home.read_text()

          if 'static const _fixedSummaryTypes = <DashboardWidgetType>{' not in source:
              start = source.index('  static const _fallbackTypes = <DashboardWidgetType>[')
              end = source.index('\n  ];', start) + len('\n  ];')
              fixed = '\n'.join([
                  '',
                  '',
                  '  static const _fixedSummaryTypes = <DashboardWidgetType>{',
                  '    DashboardWidgetType.totalBalance,',
                  '    DashboardWidgetType.monthlyCashFlow,',
                  '    DashboardWidgetType.safeToSpend,',
                  '  };',
              ])
              source = source[:end] + fixed + source[end:]

          if 'final secondaryDashboardWidgets =' not in source:
              needle = '\n'.join([
                  '    final dashboardWidgets = isTotal',
                  '        ? _visibleDashboardWidgets(state)',
                  '        : const <DashboardWidgetConfig>[];',
              ])
              if needle not in source:
                  raise SystemExit('dashboardWidgets assignment not found')
              secondary = '\n'.join([
                  needle,
                  '    final secondaryDashboardWidgets = dashboardWidgets',
                  '        .where((config) => !_fixedSummaryTypes.contains(config.type))',
                  '        .toList(growable: false);',
              ])
              source = source.replace(needle, secondary, 1)

          build_prefix = source[:source.index('  List<DashboardWidgetConfig> _visibleDashboardWidgets')]
          if '_TotalOverviewSummary(' not in build_prefix:
              quick = '\n'.join([
                  '              _QuickActions(',
                  '                onOpen: (type) => _openQuick(context, type, effectiveAccountId),',
                  '              ),',
              ])
              if quick not in source:
                  raise SystemExit('quick actions call not found')
              summary_call = '\n'.join([
                  '              if (isTotal) ...[',
                  '                _TotalOverviewSummary(',
                  '                  balance: balance,',
                  '                  income: income,',
                  '                  expense: expense,',
                  '                  available: state.safeToSpend,',
                  '                ),',
                  '                const SizedBox(height: 20),',
                  '              ],',
                  quick,
              ])
              source = source.replace(quick, summary_call, 1)

          if 'class _TotalOverviewSummary extends StatelessWidget' not in source:
              marker = 'class _QuickActions extends StatelessWidget {'
              if marker not in source:
                  raise SystemExit('QuickActions class not found')
              summary_class = '\n'.join([
                  'class _TotalOverviewSummary extends StatelessWidget {',
                  '  const _TotalOverviewSummary({',
                  '    required this.balance,',
                  '    required this.income,',
                  '    required this.expense,',
                  '    required this.available,',
                  '  });',
                  '',
                  '  final double balance;',
                  '  final double income;',
                  '  final double expense;',
                  '  final double available;',
                  '',
                  '  @override',
                  '  Widget build(BuildContext context) {',
                  '    final state = AppScope.of(context);',
                  '    return Column(',
                  '      crossAxisAlignment: CrossAxisAlignment.start,',
                  '      children: [',
                  "        Text('PATRIMONIO', style: Theme.of(context).textTheme.labelMedium),",
                  '        const SizedBox(height: 6),',
                  '        Text(',
                  "          state.hideBalance ? '••••••' : moneyFor(state, balance),",
                  '          style: Theme.of(context).textTheme.displaySmall,',
                  '        ),',
                  '        const SizedBox(height: 20),',
                  '        Row(',
                  '          crossAxisAlignment: CrossAxisAlignment.start,',
                  '          children: [',
                  '            Expanded(',
                  '              child: _Metric(',
                  "                label: 'Entrate',",
                  "                value: state.hideBalance ? '••••' : moneyFor(state, income),",
                  '                color: context.financeColors.positive,',
                  '              ),',
                  '            ),',
                  '            const SizedBox(width: 12),',
                  '            Expanded(',
                  '              child: _Metric(',
                  "                label: 'Spese',",
                  "                value: state.hideBalance ? '••••' : moneyFor(state, expense),",
                  '                color: context.financeColors.negative,',
                  '              ),',
                  '            ),',
                  '            const SizedBox(width: 12),',
                  '            Expanded(',
                  '              child: _Metric(',
                  "                label: 'Disponibile',",
                  "                value: state.hideBalance ? '••••' : moneyFor(state, available),",
                  '              ),',
                  '            ),',
                  '          ],',
                  '        ),',
                  '      ],',
                  '    );',
                  '  }',
                  '}',
                  '',
                  '',
              ])
              source = source.replace(marker, summary_class + marker, 1)

          home.write_text(source)

          settings = Path('lib/screens/settings_screen.dart')
          source = settings.read_text()

          load_start = source.index('  void _load(AppState state) {', source.index('class _DashboardCustomizerScreenState'))
          load_end = source.index('\n\n  Future<void> _save', load_start)
          new_load = '\n'.join([
              '  void _load(AppState state) {',
              '    items ??= state.dashboardWidgets',
              '        .where((item) => !_fixedSummaryTypes.contains(item.type))',
              '        .toList()',
              '      ..sort((a, b) => a.orderIndex.compareTo(b.orderIndex));',
              '  }',
          ])
          source = source[:load_start] + new_load + source[load_end:]

          save_start = source.index('  Future<void> _save(AppState state) async {', source.index('class _DashboardCustomizerScreenState'))
          save_end = source.index('\n\n  @override', save_start)
          new_save = '\n'.join([
              '  Future<void> _save(AppState state) async {',
              '    final fixed = state.dashboardWidgets',
              '        .where((item) => _fixedSummaryTypes.contains(item.type))',
              '        .toList()',
              '      ..sort((a, b) => a.orderIndex.compareTo(b.orderIndex));',
              '    final normalizedItems = <DashboardWidgetConfig>[];',
              '    for (var index = 0; index < items!.length; index++) {',
              '      final item = items![index];',
              '      normalizedItems.add(',
              '        DashboardWidgetConfig(',
              '          type: item.type,',
              '          enabled: item.enabled,',
              '          orderIndex: fixed.length + index,',
              '          size: item.size,',
              '        ),',
              '      );',
              '    }',
              '    items = normalizedItems;',
              '    final normalized = <DashboardWidgetConfig>[',
              '      for (var index = 0; index < fixed.length; index++)',
              '        DashboardWidgetConfig(',
              '          type: fixed[index].type,',
              '          enabled: true,',
              '          orderIndex: index,',
              '          size: fixed[index].size,',
              '        ),',
              '      ...normalizedItems,',
              '    ];',
              '    await state.saveDashboard(normalized);',
              '  }',
          ])
          source = source[:save_start] + new_save + source[save_end:]

          if 'Patrimonio, Entrate, Spese e Disponibile restano fissi' not in source:
              needle = '      body: ReorderableListView.builder(\n'
              if needle not in source:
                  raise SystemExit('ReorderableListView builder not found')
              header = '\n'.join([
                  '      body: ReorderableListView.builder(',
                  '        header: const Padding(',
                  '          padding: EdgeInsets.fromLTRB(8, 8, 8, 20),',
                  '          child: Text(',
                  "            'Patrimonio, Entrate, Spese e Disponibile restano fissi in alto, sopra le azioni rapide. Qui puoi mostrare, nascondere, ridimensionare e riordinare le sezioni successive.',",
                  '          ),',
                  '        ),',
              ]) + '\n'
              source = source.replace(needle, header, 1)

          settings.write_text(source)
      - run: dart format lib/screens/account_context_home_screen.dart lib/screens/settings_screen.dart test/home_summary_layout_test.dart
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already repaired"
            exit 0
          fi
          git config user.name "Dada"
          git config user.email "63845798+andreadada@users.noreply.github.com"
          git add lib/screens/account_context_home_screen.dart lib/screens/settings_screen.dart test/home_summary_layout_test.dart
          git commit -m "fix: complete Home summary restoration"
          git push origin HEAD:build/restore-home-summary
