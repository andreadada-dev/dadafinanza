name: Temporary Home summary repair

on:
  push:
    branches:
      - 'build/restore-home-summary'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/restore-home-summary
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Align fixed summary metrics
        shell: python
        run: |
          from pathlib import Path

          old = '''    DashboardWidgetType.totalBalance,
              DashboardWidgetType.monthlyCashFlow,
              DashboardWidgetType.safeToSpend,'''
          new = '''    DashboardWidgetType.totalBalance,
              DashboardWidgetType.monthlyIncome,
              DashboardWidgetType.monthlyExpense,
              DashboardWidgetType.safeToSpend,'''

          for file_name in [
              'lib/screens/account_context_home_screen.dart',
              'lib/screens/settings_screen.dart',
          ]:
              path = Path(file_name)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f'fixed summary set not found in {file_name}')
              path.write_text(source.replace(old, new, 1))

          test = Path('test/home_summary_layout_test.dart')
          source = test.read_text()
          needle = "    expect(source, contains('_fixedSummaryTypes.contains(config.type)'));"
          replacement = '''    expect(source, contains('_fixedSummaryTypes.contains(config.type)'));
              expect(source, contains('DashboardWidgetType.monthlyIncome'));
              expect(source, contains('DashboardWidgetType.monthlyExpense'));'''
          if 'DashboardWidgetType.monthlyIncome' not in source:
              source = source.replace(needle, replacement, 1)
              test.write_text(source)
      - run: dart format lib/screens/account_context_home_screen.dart lib/screens/settings_screen.dart test/home_summary_layout_test.dart
      - name: Commit metric alignment
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already aligned"
            exit 0
          fi
          git config user.name "Dada"
          git config user.email "63845798+andreadada@users.noreply.github.com"
          git add lib/screens/account_context_home_screen.dart lib/screens/settings_screen.dart test/home_summary_layout_test.dart
          git commit -m "fix: keep Home overview metrics fixed"
          git push origin HEAD:build/restore-home-summary
