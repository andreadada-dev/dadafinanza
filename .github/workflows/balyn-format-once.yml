name: Balyn temporary formatter
on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/balyn-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Format edited Dart code
        run: |
          dart format lib/screens/quick_add_page.dart lib/widgets/balyn_transaction_detail_content.dart lib/screens/preset_management_screen.dart lib/services/finance_schema_service.dart lib/services/quick_preset_service.dart lib/widgets/balyn_quick_action_launcher.dart lib/widgets/balyn_preset_visual.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/quick_add_page.dart lib/widgets/balyn_transaction_detail_content.dart lib/screens/preset_management_screen.dart lib/services/finance_schema_service.dart lib/services/quick_preset_service.dart lib/widgets/balyn_quick_action_launcher.dart lib/widgets/balyn_preset_visual.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format Balyn preset and movement changes"
            git push origin HEAD:fix/balyn-visible-liquid-background
          fi
