name: Temporary Smart Metadata Formatter

on:
  push:
    branches:
      - build/smart-notes-tags-voice

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/smart-notes-tags-voice
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Update Smart suggestion regression test for lazy metadata field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/quick_add_suggestion_test.dart')
          text = path.read_text(encoding='utf-8')
          old = """  );
  await tester.pump();
}

Future<void> enterHighConfidenceSuggestion"""
          new = """  );
  await tester.pump();
  await tester.scrollUntilVisible(
    descriptionField(),
    320,
    scrollable: find.byType(Scrollable).first,
  );
  await tester.pump();
}

Future<void> enterHighConfidenceSuggestion"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one pumpQuickAdd anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format sources
        run: dart format lib test
      - name: Commit regression-test adaptation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test/quick_add_suggestion_test.dart
            git commit -m "test: adapt Smart suggestion tests to metadata field layout"
            git push origin HEAD:build/smart-notes-tags-voice
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
