name: One-time formatting for Balyn UI redesign

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/format-revolut-redesign-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format only the redesigned Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/theme/app_theme.dart \
            lib/screens/account_context_home_screen.dart \
            lib/screens/account_context_transactions_screen.dart \
            lib/screens/account_context_analytics_screen.dart \
            lib/screens/advances_screen.dart \
            lib/screens/planning_screens.dart \
            lib/screens/personal_settings_screen.dart \
            lib/screens/data_management_screen.dart \
            lib/widgets/account_context_selector.dart \
            lib/widgets/finance_quick_action.dart
          git diff --check
          git add lib/theme/app_theme.dart lib/screens/account_context_home_screen.dart \
            lib/screens/account_context_transactions_screen.dart \
            lib/screens/account_context_analytics_screen.dart lib/screens/advances_screen.dart \
            lib/screens/planning_screens.dart lib/screens/personal_settings_screen.dart \
            lib/screens/data_management_screen.dart lib/widgets/account_context_selector.dart \
            lib/widgets/finance_quick_action.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style: dart format Balyn Revolut redesign"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
