name: Normalize introduction_screen integration once

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/format-introduction-screen-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve and normalize package files
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/screens/balyn_onboarding_flow.dart test/balyn_revolut_finance_redesign_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib/screens/balyn_onboarding_flow.dart test/balyn_revolut_finance_redesign_test.dart pubspec.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(onboarding): lock introduction_screen 4.0.0 and format widgets"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
