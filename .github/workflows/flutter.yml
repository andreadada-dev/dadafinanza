name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'ui/**'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get
      - name: Format source
        run: dart format lib test
      - name: Commit formatting
        if: github.ref_name == 'ui/cashew-sossoldi-restyle'
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Format latest restyle changes"
          git push origin HEAD:ui/cashew-sossoldi-restyle
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Bound Gradle resources for shared runner
        shell: bash
        run: |
          properties=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$properties"; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8/' "$properties"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' >> "$properties"
          fi
          cat >> "$properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx512m
          EOF
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: flutter build apk --debug
      - name: Verify debug APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk
