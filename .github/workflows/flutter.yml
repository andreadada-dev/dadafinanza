name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'ui/**'

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get
      - name: Format source
        run: dart format lib test
      - name: Commit formatting
        if: github.ref_name == 'ui/cashew-sossoldi-restyle'
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Format Home full-width fix"
          git push origin HEAD:ui/cashew-sossoldi-restyle
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
