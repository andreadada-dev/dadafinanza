name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'ui/**'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, local-pc, general]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Repair incomplete Flutter SDK cache
        shell: bash
        run: |
          cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/flutter/stable-3.47.2-x64"
          if [ -d "$cache_root" ] && [ ! -f "$cache_root/flutter/bin/internal/shared.sh" ]; then
            echo "Removing incomplete Flutter SDK cache: $cache_root"
            rm -rf "$cache_root"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Trust cached Flutter SDK
        shell: bash
        run: |
          if ! git config --global --get-all safe.directory | grep --fixed-strings --line-regexp --quiet "$FLUTTER_ROOT"; then
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi

      - name: Pub get
        run: flutter pub get
      - name: Format check
        shell: bash
        run: |
          dart format lib test
          git diff -- test/home_summary_layout_test.dart
          git diff --quiet -- lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Bound Gradle resources for shared runner
        shell: bash
        run: |
          properties=android/gradle.properties
          if grep -q '^org.gradle.jvmargs=' "$properties"; then
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8/' "$properties"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' >> "$properties"
          fi
          cat >> "$properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx512m
          EOF
      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: flutter build apk --debug
      - name: Verify debug APK
        run: test -f build/app/outputs/flutter-apk/app-debug.apk
