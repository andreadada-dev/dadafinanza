name: Flutter validation

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'ui/**'
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Focused shader and navigation tests
        run: flutter test test/smooth_indexed_pages_test.dart test/balyn_background_shader_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
