name: One-off branding formatter

on:
  push:
    branches:
      - 'feature/branding-logo'
    paths:
      - '.github/workflows/oneoff-branding-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get
      - run: dart format lib/screens/personal_settings_screen.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/personal_settings_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format settings branding"
          git push origin HEAD:"${GITHUB_REF_NAME}"
