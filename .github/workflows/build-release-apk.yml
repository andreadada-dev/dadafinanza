name: Build Internal Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o commit da compilare"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build internal release APK
    runs-on: [self-hosted, linux, x64, local-pc, android, release]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Verify local build export
        shell: bash
        run: |
          if [ ! -d /builds ]; then
            echo "::error::/builds is not mounted on the Android release runner."
            exit 1
          fi
          mkdir -p /builds/dadafinanza
          test -w /builds/dadafinanza

      - name: Show source
        run: |
          echo "Requested ref: ${{ inputs.ref }}"
          echo "Resolved commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Repair incomplete Flutter SDK cache
        shell: bash
        run: |
          cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/flutter/stable-3.47.2-x64"
          if [ -d "$cache_root" ] && [ ! -f "$cache_root/flutter/bin/internal/shared.sh" ]; then
            echo "Removing incomplete Flutter SDK cache: $cache_root"
            rm -rf "$cache_root"
          fi

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - name: Trust Flutter SDK
        shell: bash
        run: |
          if ! git config --global --get-all safe.directory | grep --fixed-strings --line-regexp --quiet "$FLUTTER_ROOT"; then
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build internal release APK
        run: flutter build apk --release

      - name: Save APK on local PC
        shell: bash
        run: |
          set -euo pipefail
          source="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$source"
          destination="/builds/dadafinanza/DadaFinanza-internal-release-run${GITHUB_RUN_NUMBER}.apk"
          latest="/builds/dadafinanza/DadaFinanza-internal-release-latest.apk"
          cp "$source" "$destination"
          cp "$source" "$latest"
          sha256sum "$destination" | tee "$destination.sha256"
          echo "APK saved to: $destination"
