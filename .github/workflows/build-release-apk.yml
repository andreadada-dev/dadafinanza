name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o commit da compilare"
        required: true
        default: "main"
        type: string

concurrency:
  group: release-apk-${{ github.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: [self-hosted, linux, x64, coolify]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show source
        run: |
          echo "Requested ref: ${{ inputs.ref }}"
          echo "Resolved commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Trust cached Flutter SDK
        shell: bash
        run: |
          if ! git config --global --get-all safe.directory | grep --fixed-strings --line-regexp --quiet "$FLUTTER_ROOT"; then
            git config --global --add safe.directory "$FLUTTER_ROOT"
          fi

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DadaFinanza-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DadaFinanza-release-apk
          path: DadaFinanza-release.apk
          if-no-files-found: error
          retention-days: 7
