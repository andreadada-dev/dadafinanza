name: Format Balyn shader files

on:
  push:
    branches:
      - feature/balyn-animated-shaders

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format shader feature files
        run: >
          dart format
          lib/screens/account_context_analytics_screen.dart
          lib/screens/account_context_home_screen.dart
          lib/screens/app_shell.dart
          lib/screens/transaction_screens.dart
          lib/widgets/finance_charts.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/screens/account_context_analytics_screen.dart             lib/screens/account_context_home_screen.dart             lib/screens/app_shell.dart             lib/screens/transaction_screens.dart             lib/widgets/finance_charts.dart
          git commit -m "style: format shader feature files"
          git push
