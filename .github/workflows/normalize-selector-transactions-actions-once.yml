name: Normalize Revolut UI fixes (retry)

on:
  push:
    branches:
      - fix/balyn-visible-liquid-background
    paths:
      - .github/workflows/normalize-selector-transactions-actions-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format only edited sources and commit
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/widgets/balyn_cue_section_bar.dart lib/widgets/balyn_quick_action_launcher.dart lib/widgets/balyn_swipe_delete_tile.dart lib/widgets/balyn_transaction_detail_content.dart test/home_glass_navigation_test.dart test/balyn_revolut_finance_redesign_test.dart
          dart format --output=none --set-exit-if-changed lib test
          git diff --check
          git add lib/widgets/balyn_cue_section_bar.dart lib/widgets/balyn_quick_action_launcher.dart lib/widgets/balyn_swipe_delete_tile.dart lib/widgets/balyn_transaction_detail_content.dart test/home_glass_navigation_test.dart test/balyn_revolut_finance_redesign_test.dart
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: normalize centered Cue and Revolut transaction details"
            git push origin "HEAD:fix/balyn-visible-liquid-background"
          fi
