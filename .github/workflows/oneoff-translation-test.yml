name: One-off translation endpoint test

on:
  push:
    branches:
      - 'feature/multilanguage'

permissions:
  contents: write

concurrency:
  group: dadafinanza-translate-test
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test translation endpoint
        shell: python
        run: |
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import json
          from pathlib import Path

          samples = ["Impostazioni", "Nuovo movimento", "Premi di nuovo Indietro per chiudere."]
          out = {}
          for lang in ["en", "es", "zh-CN", "ar"]:
              out[lang] = []
              for text in samples:
                  query = urlencode({"client":"gtx","sl":"it","tl":lang,"dt":"t","q":text})
                  req = Request("https://translate.googleapis.com/translate_a/single?" + query, headers={"User-Agent":"Mozilla/5.0"})
                  with urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  out[lang].append("".join(chunk[0] for chunk in payload[0] if chunk and chunk[0]))
          target = Path("tools/translate_test.json")
          target.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False))

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/translate_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test build-time localization translations"
          git push origin HEAD:"${GITHUB_REF_NAME}"
